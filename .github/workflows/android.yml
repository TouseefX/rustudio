name: Android

# APKs for aarch64 (arm64-v8a) and x86_64 (the emulator), debug and release,
# built with xbuild (https://github.com/rust-mobile/xbuild): `x build
# -p rustudio-android --platform android --arch <arm64|x64> --format apk`.
# crates/rustudio-android is the cdylib NativeActivity loads; its
# manifest.yaml is the AndroidManifest. Nothing here touches the desktop
# builds (ci.yml).

on:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "crates/**"
      - "vendor/**"
      - "assets/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "api-dump.json"
      - "mechanics.json"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "src/**"
      - "crates/**"
      - "vendor/**"
      - "assets/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "api-dump.json"
      - "mechanics.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile (debug, release, or both)"
        required: false
        default: "both"
        type: choice
        options: [debug, release, both]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # xbuild at this commit (crates.io's 0.2.0 from 2022 predates the
  # manifest.yaml format and NDK downloads used here).
  XBUILD_REV: e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1

jobs:
  apk:
    name: APK ${{ matrix.arch }} ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
        # push / pull_request build both profiles; a manual run can narrow
        # it to one (github.event.inputs is empty outside workflow_dispatch).
        profile: ${{ fromJSON(github.event.inputs.profile == 'debug' && '["debug"]' || github.event.inputs.profile == 'release' && '["release"]' || '["debug", "release"]') }}
    steps:
      - uses: actions/checkout@v4

      # JDK 17: javac for xbuild's resource compiler checks and the Android
      # SDK's platform tools (xbuild itself needs no Gradle).
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The Android SDK (adb, platform tools) for `x doctor` and anyone
      # running the emulator step later; xbuild fetches the platform jar and
      # its own NDK sysroot into ~/.cache/x on first use.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-33"

      - name: Rust toolchain with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Build dependencies (clang / lld for the NDK targets, ALSA headers for the host build scripts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm pkg-config libasound2-dev

      - name: Cache cargo registry and the per-target build dir
        uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ matrix.arch }}-${{ matrix.profile }}
          # xbuild builds into target/x/<profile>/android/<arch>/cargo.
          workspaces: ". -> target/x/${{ matrix.profile }}/android/${{ matrix.arch }}/cargo"
          cache-directories: |
            ~/.cache/x

      - name: Cache xbuild binary
        id: xbuild-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/x
          key: xbuild-${{ runner.os }}-${{ env.XBUILD_REV }}

      - name: Install xbuild
        if: steps.xbuild-cache.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/rust-mobile/xbuild --rev "$XBUILD_REV" xbuild

      - name: x doctor
        run: x doctor

      - name: Build APK
        env:
          # A release signing key (PEM: private key + certificate, the
          # format `x`'s --pem takes). Without one xbuild signs with its
          # built-in debug key, which installs fine with adb.
          SIGNING_PEM: ${{ secrets.ANDROID_SIGNING_PEM }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.profile }}" = "release" ] && [ -n "${SIGNING_PEM:-}" ]; then
            export X_PEM="$SIGNING_PEM"
            echo "Signing the release APK with the provided key"
          fi
          args=(build -p rustudio-android --platform android --arch "${{ matrix.arch }}" --format apk)
          if [ "${{ matrix.profile }}" = "release" ]; then
            args+=(--release)
          fi
          x "${args[@]}"
          apk="target/x/${{ matrix.profile }}/android/rustudio-android.apk"
          test -f "$apk"
          mkdir -p dist
          cp "$apk" "dist/rustudio-${{ matrix.arch }}-${{ matrix.profile }}.apk"
          ls -l dist

      - name: APK contents
        run: |
          unzip -l "dist/rustudio-${{ matrix.arch }}-${{ matrix.profile }}.apk" | grep -E "lib/|assets/|AndroidManifest" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rustudio-${{ matrix.arch }}-${{ matrix.profile }}.apk
          path: dist/rustudio-${{ matrix.arch }}-${{ matrix.profile }}.apk
          if-no-files-found: error
          retention-days: 14

  # The same gates the desktop CI relies on, from the Android side: the
  # desktop binary still builds with the Android module compiled out.
  desktop-still-builds:
    name: Desktop check (cfg gates)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-desktop-check
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev
      - run: cargo check --workspace --all-targets
