# xbuild's manifest (https://github.com/rust-mobile/xbuild, xbuild/src/config.rs):
# what becomes the APK's AndroidManifest.xml. xbuild fills in what isn't
# here from Cargo.toml (versionName / versionCode from the package version,
# the NativeActivity with android.app.lib_name = rustudio_android, the
# config_changes list that keeps the activity alive across rotation, locale
# and density changes, minSdkVersion 21 / targetSdkVersion 33).
icon: ../../assets/icons/rustudio-512.png

android:
  manifest:
    package: dev.rustudio.studio
    sdk:
      # API 26: VibrationEffect (HapticService); 28: DisplayCutout
      # (ScreenGui.ScreenInsets); 30: WindowInsets.Type.ime (the keyboard's
      # size). Older levels are told apart at run time (src/android/jni.rs).
      min_sdk_version: 26
      target_sdk_version: 33
    uses_permission:
      # HttpService, the Roblox CDN content download, asset fetches, Team Create.
      - name: android.permission.INTERNET
      # ConnectivityManager for "is the network up" before a 60 MB download.
      - name: android.permission.ACCESS_NETWORK_STATE
      # HapticService:SetMotor / HapticEffect:Play through Vibrator.
      - name: android.permission.VIBRATE
      # The in-app file picker (src/android/storage.rs) listing shared
      # storage (Download, Documents, …) for places and models. NativeActivity
      # gets no onActivityResult, so the system document picker (Storage
      # Access Framework) can't hand a choice back; "Open with rustudio"
      # from a Files app (the VIEW intent filter below, a content: URI copied
      # in) works without any of these. API 30+: "All files access", asked
      # for with a settings page the picker opens; API 26–29: the runtime
      # storage permission (requestPermissions; read-only on API 29 under
      # scoped storage, where the app's own folder is still writable).
      - name: android.permission.MANAGE_EXTERNAL_STORAGE
      - name: android.permission.READ_EXTERNAL_STORAGE
        max_sdk_version: 32
      - name: android.permission.WRITE_EXTERNAL_STORAGE
        max_sdk_version: 29
    uses_feature:
      # wgpu: Vulkan first, OpenGL ES 3.0 as the fallback (src/lib.rs
      # wgpu_options), so Vulkan is declared but not required.
      - name: android.hardware.vulkan.level
        version: 0
        required: false
      - name: android.hardware.vulkan.version
        # 0x400003 = Vulkan 1.0.3, the lowest wgpu drives.
        version: 4194307
        required: false
      # No `opengles_version: [3, 0]` (android:glEsVersion) here: xbuild
      # e67b501 writes it as the hex string 0x00030000 but its manifest
      # compiler parses integer attributes as decimal, so `x build` fails
      # at "[3/3] Create apk" with "invalid digit found in string"
      # (apk/src/compiler/attributes.rs). The declaration is only a store
      # filter; every API 26+ device has GLES 3.0, and the GLES fallback
      # is picked at run time anyway. Put it back once xbuild accepts hex.
      - name: android.hardware.touchscreen.multitouch
        required: false
      # UserInputService.AccelerometerEnabled / GyroscopeEnabled: optional.
      - name: android.hardware.sensor.accelerometer
        required: false
      - name: android.hardware.sensor.gyroscope
        required: false
    application:
      label: rustudio
      theme: "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"
      activities:
        - # The editor is a landscape tool; a place's
          # StarterGui.ScreenOrientation re-requests the orientation while
          # it plays (Activity.setRequestedOrientation, src/android/jni.rs).
          orientation: sensorLandscape
          # Every configuration change the activity can be told about
          # instead of being recreated for (xbuild's default list plus the
          # keyboard / touch screen, the SIM, colour mode and bold text):
          # a recreation destroys the activity under a running editor,
          # which winit 0.30 never passes on (src/android/lifecycle.rs).
          # grammaticalGender (API 34) is left out: the flag isn't in the
          # API 33 android.jar xbuild compiles the manifest against.
          config_changes: orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode|touchscreen|navigation|mcc|mnc|colorMode|fontWeightAdjustment
          # The soft keyboard shrinks the window (UserInputService
          # .OnScreenKeyboardSize) instead of covering it.
          window_soft_input_mode: adjustResize
          meta_data:
            # NativeActivity calls this symbol of the library instead of
            # ANativeActivity_onCreate: crates/rustudio-android/src/lib.rs,
            # which runs android-activity's entry and then wraps the
            # activity's onDestroy (src/android/lifecycle.rs). xbuild adds
            # android.app.lib_name itself.
            - name: android.app.func_name
              value: rustudio_on_create
          intent_filters:
            # Open a place or model from a file manager / share sheet: the
            # Intent's content: URI is read through ContentResolver at
            # start (src/android/storage.rs). The patterns are written for
            # xbuild's manifest compiler, which stores attribute strings as
            # they are (no aapt backslash unescaping): one backslash makes
            # PatternMatcher's literal dot. The second pattern per extension
            # covers one more dot in the name ("my.place.rbxl"): ".*" stops
            # at the first match of what follows it.
            - actions: [android.intent.action.VIEW]
              categories: [android.intent.category.DEFAULT, android.intent.category.BROWSABLE]
              data:
                - scheme: content
                  mime_type: "*/*"
                  path_pattern: ".*\\.rbxl"
                - scheme: content
                  mime_type: "*/*"
                  path_pattern: ".*\\..*\\.rbxl"
                - scheme: content
                  mime_type: "*/*"
                  path_pattern: ".*\\.rbxlx"
                - scheme: content
                  mime_type: "*/*"
                  path_pattern: ".*\\..*\\.rbxlx"
                - scheme: content
                  mime_type: "*/*"
                  path_pattern: ".*\\.rbxm"
                - scheme: content
                  mime_type: "*/*"
                  path_pattern: ".*\\..*\\.rbxm"
                - scheme: content
                  mime_type: "*/*"
                  path_pattern: ".*\\.rbxmx"
                - scheme: content
                  mime_type: "*/*"
                  path_pattern: ".*\\..*\\.rbxmx"
                - scheme: file
                  path_pattern: ".*\\.rbxl"
                - scheme: file
                  path_pattern: ".*\\..*\\.rbxl"
                - scheme: file
                  path_pattern: ".*\\.rbxlx"
                - scheme: file
                  path_pattern: ".*\\..*\\.rbxlx"
                - scheme: file
                  path_pattern: ".*\\.rbxm"
                - scheme: file
                  path_pattern: ".*\\..*\\.rbxm"
                - scheme: file
                  path_pattern: ".*\\.rbxmx"
                - scheme: file
                  path_pattern: ".*\\..*\\.rbxmx"
  # api-dump.json ships in the APK's assets/ and is copied to the app's
  # files dir at first start (src/android/assets.rs), where
  # paths::resource finds it.
  assets:
    - ../../api-dump.json
