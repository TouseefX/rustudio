[workspace]
# The root package is a member by itself (Cargo adds it); listing it as "."
# as well makes xbuild refuse the workspace ("Did not expect a [workspace]").
members = ["crates/rustudio-profiler-ui", "crates/rustudio-core", "crates/rustudio-physics", "crates/rustudio-render", "crates/rustudio-engine", "crates/rustudio-player", "crates/rustudio-account", "crates/rustudio-net", "crates/rustudio-android"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.6.0"

[package]
name = "rustudio"
description = "A native game editor for Roblox place and model files"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "rustudio"

# The app is a library (src/lib.rs) with two front ends: the desktop binary
# (src/main.rs) and the Android cdylib (crates/rustudio-android), which is
# what xbuild packages into the APK. No doctests: the `///` comments quote
# Luau and shell, not Rust.
[lib]
name = "rustudio"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "rustudio"
path = "src/main.rs"

[dependencies]
log = "0.4"
rustudio-account = { path = "crates/rustudio-account" }
rustudio-core = { path = "crates/rustudio-core" }
rustudio-physics = { path = "crates/rustudio-physics" }
rustudio-render = { path = "crates/rustudio-render" }
rustudio-engine = { path = "crates/rustudio-engine" }
rustudio-player = { path = "crates/rustudio-player" }
rustudio-profiler-ui = { path = "crates/rustudio-profiler-ui" }
rustudio-net = { path = "crates/rustudio-net" }
libc = "0.2"
eframe = { version = "0.36", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts", "links"] }
winit = { version = "0.30", default-features = false }
egui = "0.36"
egui-wgpu = "0.36"
egui_dock = { version = "0.21", features = ["serde"] }
rbx_dom_weak = "4"
rbx_binary = "3"
rbx_xml = "3"
# Only the bundled database: never a machine-wide .rbxreflection file another
# tool left (it also feeds rbx_binary / rbx_xml), so the version is the one we ship.
rbx_reflection_database = { version = "3", features = ["debug_always_use_bundled"] }
rbx_reflection = "7"
rbx_types = "3"
glam = { version = "0.30", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
pollster = "0.4"
mlua = { version = "0.12", features = ["luau"] }
rapier3d = { version = "0.36", features = ["parallel", "profiler"] }
draco-core = { version = "2.3", default-features = false, features = ["decoder", "edgebreaker_valence_decode", "legacy_bitstream_decode"] }
rodio = { version = "0.23", default-features = false, features = ["playback", "vorbis", "mp3", "wav", "flac"] }
notify = "8"
glob = "0.3"
toml = "0.9"
rustc-hash = "2"
# services domain: HttpService (real HTTP), EncodingService (zstd, hashes)
ureq = "3"
# HttpService:CreateWebStreamClient (WebSocket type). Mozilla's roots too:
# Android's CA store is one rustls-native-certs can't read (as
# crates/rustudio-account), which would leave wss:// with no roots.
tungstenite = { version = "0.30", features = ["rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
zstd = "0.13"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
blake2 = "0.10"
blake3 = "1"
dirs = "6"
chrono = { version = "0.4.35", default-features = false, features = ["clock"] }

[profile.dev]
opt-level = 1

# The shipped build (the APKs: `x build --release`): thin LTO lets the
# compiler inline across the crates a frame crosses thousands of times
# (rustudio-engine -> rustudio-core's document and variants, the physics
# solver's modules, the renderer's) and one codegen unit a crate lets it
# optimise each crate whole; a phone's CPU shows the difference first.
# A quicker local release build: CARGO_PROFILE_RELEASE_LTO=off
# CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16.
[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2

# `cargo build --profile profiling` for perf: release speed with symbols.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"

# Desktop only: rfd 0.15 has no Android backend (its FileDialog traits
# aren't implemented there). Android's picker is src/android/storage.rs.
[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.15"

[target.'cfg(target_os = "android")'.dependencies]
# NativeActivity glue (android_main, the lifecycle, the soft keyboard) comes
# through eframe's own winit; the feature must be on for eframe to build at
# all on Android (NativeOptions::android_app).
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "android-native-activity"] }
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }
# JNI bridges (src/android/): Vibrator, setRequestedOrientation, WindowInsets,
# the launch Intent; ndk-context hands over the JavaVM and the Activity.
jni = "0.22"
ndk-context = "0.1"
# AAssetManager (api-dump.json out of the APK), ASensorManager (accelerometer
# / gyroscope / rotation for UserInputService), ALooper.
ndk = "0.9"
ndk-sys = "0.6"
# log → logcat (eframe, wgpu and rustudio's own lines; stdout / stderr are
# piped there too, see src/android/logcat.rs).
log = "0.4"
android_logger = "0.15"
# The Vulkan loader, for the probe that checks which driver answers after
# the Turnip swap (src/android/turnip.rs): the same crate and version
# wgpu-hal drives Vulkan with, so nothing extra is built.
ash = "0.38"

[target.'cfg(windows)'.dependencies]
# The Recycle Bin (platform.rs); thread/process CPU time, cycles and peak
# memory for --bench / --result (bench.rs, app.rs).
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_System_ProcessStatus"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The Finder trash (platform.rs), the app menu and Finder's Open (macos.rs).
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSFileManager", "NSURL", "NSString", "NSError", "NSAppleEventDescriptor", "NSAppleEventManager", "NSNotification", "NSObject"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSMenu", "NSMenuItem", "NSEvent"] }

[dev-dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
skrifa = "0.44"
syn = "2"
draco-core = { version = "2.3", default-features = false, features = ["decoder", "encoder"] }

[patch.crates-io]
rustls = { path = "vendor/rustls" }
# Luau 745 (crates.io luau0-src 0.23.0+luau745): its compiler reuses dead
# locals' registers, without which Place A' Weapons client (3k lines)
# runs out of the 200 local registers. mlua-sys 0.13.0 is vendored only to
# accept it (dep 0.22 -> 0.23, bytecode version max 11 -> 14). See
# runtime::luau_flags. Also patched (lvmload.cpp resolveImportSafe, marked
# rustudio): a script's global chains (CFrame.new, math.sin) resolve at load
# through the environment the chunk is loaded with, as Roblox's do.
luau0-src = { path = "vendor/luau0-src" }
mlua-sys = { path = "vendor/mlua-sys" }
# parry3d 0.31.1 with one change (shape/convex_polyhedron.rs,
# local_support_feature_toward): a hull face of more than 4 corners gives the
# 4 around the contact, not its first 4 (stones rocking on union ground).
parry3d = { path = "vendor/parry3d" }
# mlua 0.12.2 + Lua::with_current_state (src/state.rs, marked rustudio):
# the direct Instance bridge (runtime_routes.rs) calls Rust from raw C
# functions and must make the calling Lua thread mlua's current one, as
# mlua's own callbacks do. RawLua::rs_lua / rs_stack_value (state/raw.rs):
# natively stored datatypes' (ltypes.rs CFrame) FromLua::from_stack and
# IntoLua::push_into_stack overrides. Lua::userdata_type_at /
# userdata_copy_of: typed property writes (runtime_routes.rs). AppData keeps
# its 8 most recent entries in front of the map (types/app_data.rs).
mlua = { path = "vendor/mlua" }
# egui 0.36.2 patched (text_selection/, scroll_area.rs): double/
# triple click select on the press, not the release, like Studio.
egui = { path = "vendor/egui" }
# egui-wgpu 0.36.2 + a Mailbox request that falls back to Fifo when the
# surface lists no mailbox (src/winit.rs, marked rustudio): the editor's
# interactive present mode (offscreen.rs wgpu_options).
egui-wgpu = { path = "vendor/egui-wgpu" }
# epaint 0.36.2 + Fonts::set_measure_only (marked rustudio): TextScaled's
# trial sizes are laid out without rasterizing their glyphs. Rasterizing was
# ~94% of each trial on a game's ~1,000 TextScaled signs, so the per-frame text
# budget ran a handful of trials and the signs stayed unfitted for the whole
# session, their GUIs walked again every frame (round 3).
epaint = { path = "vendor/epaint" }
# egui_dock 0.21.1 + a pop-out button next to each tab's close × (TabViewer::
# show_pop_out_button / on_pop_out, marked rustudio): src/panels.rs.
egui_dock = { path = "vendor/egui_dock" }
# rbx_dom_weak 4.2.0 + detach_children / detach_descendants and an
# end-first child removal: bulk Destroy / ClearAllChildren without a scan
# of the parent's child list per child (round 2 perf, bulk).
rbx_dom_weak = { path = "vendor/rbx_dom_weak" }
# rbx_binary 3.0.1 + Deserializer::skip_defaults (marked rustudio): a
# property value equal to what the reader falls back to isn't stored
# (doc.rs implied_default). A 44 MB place parsed to 4.8 GB, 69% defaults.
rbx_binary = { path = "vendor/rbx_binary" }
# rapier3d 0.36.1 + CollisionPipeline::contact_recycle_distance (marked
# rustudio): the Studio solver port (the default; src/solver) runs
# rapier's collision detection alone and needs its contact recycling to cost
# what the narrow phase costs inside rapier's own pipeline
# (checks/humanoid-physics/solver/HARNESS.md "The switch").
rapier3d = { path = "vendor/rapier3d" }

# Fast rebuilds for test runs by agents and for local iteration: release
# optimisation, but compiled in many small units that are reused between
# builds, so a one-file change recompiles only what it touched.
# Use: cargo build --profile agent   (binary: target/agent/rustudio)
# Slightly slower at run time than --release; measure performance and build
# what gets installed with --release.
[profile.agent]
inherits = "release"
incremental = true
codegen-units = 256

[build-dependencies]
winresource = "0.1.34"
